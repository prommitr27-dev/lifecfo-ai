# Thresholds for ShockProof risk indicators.
# Owner: Member 3 (Risk and Evaluation).
# Read by the assess_financial_risk tool (lifecfo/agents/indicators.py). While a
# value is null the indicator is shown without a rating; nothing is invented.
# Define and justify the values in docs/SHOCKPROOF_DESIGN.md.

days_until_shortfall:
  high_risk_below: null
  medium_risk_below: null

emergency_reserve_months_of_essentials:
  adequate_at_or_above: null
  low_below: null

essential_bill_coverage_ratio:
  at_risk_below: null
