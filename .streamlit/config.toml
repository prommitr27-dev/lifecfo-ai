# Visual theme for the Streamlit app.
# Soft, calm style in the spirit of planner and focus-timer apps: warm cream
# background, lavender accent, mint and peach highlights, rounded Nunito type.
# Red is kept for errors only, so it never doubles as the accent colour.

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6E5BD6"
backgroundColor = "#FBF8F3"
secondaryBackgroundColor = "#F3EEFB"
textColor = "#2E2A47"
linkColor = "#6E5BD6"
borderColor = "#ECE6F5"
dataframeBorderColor = "#ECE6F5"
dataframeHeaderBackgroundColor = "#F6F2FC"
dataframeHeaderTextColor = "#4A4466"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "1rem"
buttonRadius = "999px"
font = "Nunito, sans-serif:https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
codeFont = "IBM Plex Mono, monospace:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 700, 700, 700, 700, 700]
headingFontSizes = ["1.9rem", "1.35rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
metricValueFontWeight = 700
redColor = "#DC2626"
greenColor = "#2F8F6F"
blueColor = "#6E5BD6"
yellowColor = "#B7791F"
chartCategoricalColors = ["#6E5BD6", "#3FA387", "#E28A5B", "#E0B341", "#8A84A3"]

[theme.sidebar]
backgroundColor = "#F3EEFB"
secondaryBackgroundColor = "#FFFFFF"
